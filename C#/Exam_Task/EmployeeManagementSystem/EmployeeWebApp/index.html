<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-people-fill me-2"></i>Employee Directory
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="Search by Name, Email, Department, or Employee ID..." />
                </div>
            </div>
            <div class="col-md-6 text-end">
                <span id="recordCount" class="badge bg-primary fs-6"></span>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th class="sortable" data-sort="EmployeeID">
                            ID <i class="bi bi-arrow-down-up sort-icon"></i>
                        </th>
                        <th class="sortable" data-sort="Name">
                            Name <i class="bi bi-arrow-down-up sort-icon"></i>
                        </th>
                        <th class="sortable" data-sort="Department">
                            Department <i class="bi bi-arrow-down-up sort-icon"></i>
                        </th>
                        <th class="sortable" data-sort="Email">
                            Email <i class="bi bi-arrow-down-up sort-icon"></i>
                        </th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                </tbody>
            </table>
        </div>

        <div id="noRecords" class="alert alert-warning text-center d-none">
            <i class="bi bi-exclamation-triangle me-2"></i>No employees found.
        </div>

        <div id="errorMessage" class="alert alert-danger text-center d-none">
            <i class="bi bi-x-circle me-2"></i><span id="errorText"></span>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div id="pageInfo" class="text-muted"></div>
            <nav>
                <ul class="pagination mb-0" id="pagination"></ul>
            </nav>
        </div>
    </div>

    <div class="modal fade" id="employeeDetailModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="bi bi-person-badge me-2"></i>Employee Details
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingSpinner" class="text-center my-5 d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading employee data...</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
